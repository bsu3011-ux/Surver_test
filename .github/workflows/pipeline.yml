name: 어쩌다지식 AI 파이프라인

on:
  # 정기 실행: 월/수/금 오전 9시 KST = 00:00 UTC
  schedule:
    - cron: "0 0 * * 1,3,5"

  # 수동 트리거 (GitHub Actions UI에서 실행 가능)
  workflow_dispatch:
    inputs:
      topic_id:
        description: "주제 ID (비워두면 자동 선택)"
        required: false
        type: string
        default: ""
      skip_to:
        description: "건너뛸 단계 (topic/script/tts/images/assemble/review/upload)"
        required: false
        type: choice
        options:
          - ""
          - topic
          - script
          - tts
          - images
          - assemble
          - review
          - upload
        default: ""
      run_id:
        description: "재개할 실행 ID (skip_to 사용 시 필요)"
        required: false
        type: string
        default: ""

jobs:
  run-pipeline:
    name: 영상 제작 파이프라인
    runs-on: ubuntu-latest
    timeout-minutes: 120  # 2시간 타임아웃

    env:
      # Anthropic
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      # Google Cloud
      GOOGLE_CLOUD_PROJECT: ${{ secrets.GOOGLE_CLOUD_PROJECT }}
      GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}

      # Telegram
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      # YouTube
      YOUTUBE_CLIENT_SECRETS_FILE: ${{ github.workspace }}/client_secrets.json

    steps:
      # ------------------------------------------------------------------
      # 1. 소스 체크아웃
      # ------------------------------------------------------------------
      - name: 소스 체크아웃
        uses: actions/checkout@v4

      # ------------------------------------------------------------------
      # 2. Python 3.11 설정
      # ------------------------------------------------------------------
      - name: Python 3.11 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      # ------------------------------------------------------------------
      # 3. 시스템 패키지 설치 (ffmpeg, Korean fonts)
      # ------------------------------------------------------------------
      - name: 시스템 패키지 설치
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            ffmpeg \
            fonts-nanum \
            fonts-nanum-coding \
            libgl1 \
            libglib2.0-0
          fc-cache -fv

      # ------------------------------------------------------------------
      # 4. Python 패키지 설치
      # ------------------------------------------------------------------
      - name: Python 의존성 설치
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      # ------------------------------------------------------------------
      # 5. GCP 서비스 계정 설정 (TTS + Imagen + Drive)
      # ------------------------------------------------------------------
      - name: GCP 서비스 계정 키 설정
        run: |
          echo '${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}' > /tmp/gcp-key.json
          echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/gcp-key.json" >> $GITHUB_ENV

      # ------------------------------------------------------------------
      # 6. YouTube OAuth2 클라이언트 시크릿 설정
      # ------------------------------------------------------------------
      - name: YouTube 클라이언트 시크릿 설정
        run: |
          echo '${{ secrets.YOUTUBE_CLIENT_SECRETS_JSON }}' > ${{ github.workspace }}/client_secrets.json

      # ------------------------------------------------------------------
      # 7. YouTube OAuth 토큰 복원 (캐시)
      # ------------------------------------------------------------------
      - name: YouTube OAuth 토큰 복원
        uses: actions/cache@v4
        with:
          path: data/youtube_token.json
          key: youtube-token-${{ runner.os }}-v1
          restore-keys: |
            youtube-token-${{ runner.os }}-

      # ------------------------------------------------------------------
      # 8. 데이터 디렉토리 생성
      # ------------------------------------------------------------------
      - name: 데이터 디렉토리 초기화
        run: |
          mkdir -p data/runs logs

      # ------------------------------------------------------------------
      # 9. 파이프라인 실행
      # ------------------------------------------------------------------
      - name: AI 파이프라인 실행
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.topic_id }}" ]; then
            ARGS="$ARGS --topic-id ${{ github.event.inputs.topic_id }}"
          fi
          if [ -n "${{ github.event.inputs.skip_to }}" ]; then
            ARGS="$ARGS --skip-to ${{ github.event.inputs.skip_to }}"
          fi
          if [ -n "${{ github.event.inputs.run_id }}" ]; then
            ARGS="$ARGS --run-id ${{ github.event.inputs.run_id }}"
          fi
          python pipeline/main.py $ARGS

      # ------------------------------------------------------------------
      # 10. 생성된 영상 아티팩트 저장
      # ------------------------------------------------------------------
      - name: 생성 영상 아티팩트 저장
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generated-video-${{ github.run_number }}
          path: |
            data/runs/**/*.mp4
            data/runs/**/*.srt
            data/runs/**/*.json
          retention-days: 7
          if-no-files-found: warn

      # ------------------------------------------------------------------
      # 11. 로그 아티팩트 저장
      # ------------------------------------------------------------------
      - name: 로그 아티팩트 저장
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-logs-${{ github.run_number }}
          path: logs/
          retention-days: 14
          if-no-files-found: ignore

      # ------------------------------------------------------------------
      # 12. YouTube OAuth 토큰 캐시 업데이트
      # ------------------------------------------------------------------
      - name: YouTube OAuth 토큰 캐시 저장
        if: always()
        uses: actions/cache@v4
        with:
          path: data/youtube_token.json
          key: youtube-token-${{ runner.os }}-v1

      # ------------------------------------------------------------------
      # 13. GCP 키 파일 정리 (보안)
      # ------------------------------------------------------------------
      - name: 임시 자격증명 파일 정리
        if: always()
        run: |
          rm -f /tmp/gcp-key.json
          rm -f ${{ github.workspace }}/client_secrets.json
